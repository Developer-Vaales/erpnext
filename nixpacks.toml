# nixpacks.toml

# Tell Nixpacks to use the Python environment
providers = ["python"]

[phases.install]
# Install system packages required by Frappe
aptPkgs = ["wkhtmltopdf", "mariadb-client"]
# Install Frappe's command-line tool
cmds = ["pip install frappe-bench"]

[start]
# The standard command to run a Frappe development server
cmd = "bench start"
