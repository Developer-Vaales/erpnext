# nixpacks.toml

providers = ["python"]

[phases.install]
# Add python3-pip and build tools to the system packages
aptPkgs = ["wkhtmltopdf", "mariadb-client", **"python3-pip"**, **"python3-dev"**, **"build-essential"**]

# This command will now work because pip is installed
cmds = ["pip install frappe-bench"]

[start]
cmd = "bench start"
