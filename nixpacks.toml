# nixpacks.toml

providers = ["python"]

[phases.install]
aptPkgs = ["wkhtmltopdf", "mariadb-client", "python3-pip", "python3-dev", "build-essential"]
cmds = ["pip install frappe-bench --break-system-packages"]

[start]
# This entire script is now a single-line command to avoid parsing errors.
# It initializes the site on the first run, and just starts the server on subsequent runs.
cmd = "bash -c 'set -e; if [ ! -d \"frappe-bench/sites\" ]; then echo \"--- First time setup... ---\" && /usr/local/bin/bench init --skip-redis-config-generation --frappe-branch develop frappe-bench && cd frappe-bench && /usr/local/bin/bench get-app ../ && /usr/local/bin/bench new-site \"$SITE_NAME\" --db-name \"$DB_NAME\" --db-host \"$DB_HOST\" --db-port \"$DB_PORT\" --db-root-username \"$DB_USER\" --db-root-password \"$DB_PASSWORD\" --admin-password \"$ADMIN_PASSWORD\" --no-mariadb-socket && /usr/local/bin/bench --site \"$SITE_NAME\" install-app erpnext; else echo \"--- Bench exists, skipping setup... ---\" && cd frappe-bench; fi; echo \"--- Starting server... ---\" && /usr/local/bin/bench serve --port 8000'"
